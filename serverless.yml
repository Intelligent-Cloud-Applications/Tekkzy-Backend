service: tekkzy-backend-dev
frameworkVersion: "3"

useDotenv: true

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-plugin-common-excludes
  - serverless-plugin-include-dependencies
  - serverless-plugin-split-stacks

package:
  excludeDevDependencies: false
  individually: true
  exclude:
    - node_modules/**
    - .git/**
    - .gitignore
    - README.md
    - docs/**

custom:
  dotenv:
    path: ${env:SLS_DOTENV_PATH, '.env'}
  esbuild:
    packager: "npm"
    concurrency: 4
    zipConcurrency: 1
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    external:
      - "@aws-sdk/client-route-53-domains"
  splitStacks:
    perFunction: false
    perType: false
    perGroupFunction: true
    nestedStackCount: 10

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-2'}
  stage: ${opt:stage, 'dev'}
  deploymentMethod: direct
  memorySize: 512
  timeout: 29
  deploymentBucket:
    name: ${env:SERVERLESS_DEPLOYMENT_BUCKET, 'tekkzy-backend-dev'}
  environment:
    STAGE: ${self:provider.stage}
    DATA_AWS_REGION: ${env:DATA_AWS_REGION, self:provider.region}
    COGNITO_REGION: ${env:COGNITO_REGION, env:DATA_AWS_REGION, self:provider.region}
    RAZORPAY_TEST_KEY_ID: ${env:RAZORPAY_TEST_KEY_ID, ''}
    RAZORPAY_TEST_SECRET_KEY: ${env:RAZORPAY_TEST_SECRET_KEY, ''}
    RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET, ''}
    RAZORPAY_PLAN_ID_MONTHLY: ${env:RAZORPAY_PLAN_ID_MONTHLY, ''}
    RAZORPAY_PLAN_ID_YEARLY: ${env:RAZORPAY_PLAN_ID_YEARLY, ''}
    TEKKZY_DOMAIN_GRACE_DAYS: ${env:TEKKZY_DOMAIN_GRACE_DAYS, '7'}
    DOMAIN_MARKUP_USD: ${env:DOMAIN_MARKUP_USD, '5'}
    USD_TO_INR_RATE: ${env:USD_TO_INR_RATE, '86'}
    PROFILE_TABLE_NAME: ${env:PROFILE_TABLE_NAME, 'beta_user_profile'}
    PAYMENT_TABLE_NAME: ${env:PAYMENT_TABLE_NAME, 'beta_payment'}
    BETA_TEMPLATE_TABLE: ${env:BETA_TEMPLATE_TABLE, 'beta_tekkzy_template'}
    SITE_TABLE: ${env:SITE_TABLE, 'beta_site_table'}
    HOSTED_ZONE_ID: ${env:HOSTED_ZONE_ID, ''}
    SITE_DEPLOY_BUCKET: ${env:SITE_DEPLOY_BUCKET, 'thekalahandiheritage.com'}
    TEMPLATE_ASSETS_BUCKET: ${env:TEMPLATE_ASSETS_BUCKET, 'institution-utils'}
    TEMPLATE_ASSETS_BUCKET_REGION: ${env:TEMPLATE_ASSETS_BUCKET_REGION, 'us-east-1'}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-2_J02pfxenV'}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, '1oui8eijud46ajipjeg01h4i3m'}
    COGNITO_IDENTITY_POOL_ID: ${env:COGNITO_IDENTITY_POOL_ID, 'us-east-2:2966c931-c163-4682-89d6-9bf8c491e5b7'}
    PAYPAL_CLIENT_ID: ${env:PAYPAL_CLIENT_ID, ''}
    PAYPAL_SECRET: ${env:PAYPAL_SECRET, ''}
    AWSAIAPP_PAYPAL_CLIENT_ID: ${env:AWSAIAPP_PAYPAL_CLIENT_ID, ''}
    AWSAIAPP_PAYPAL_SECRET: ${env:AWSAIAPP_PAYPAL_SECRET, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:*
            - ses:*
            - sns:*
          Resource: "*"
        - Effect: Allow
          Action:
            - dynamodb:*
            - cognito-idp:*
            - cognito-identity:*
          Resource: "*"
        - Effect: Allow
          Action:
            - route53:*
            - route53domains:*
          Resource: "*"
        - Effect: Allow
          Action:
            - cloudfront:*
          Resource: "*"
        - Effect: Allow
          Action:
            - acm:*
          Resource: "*"

functions:
  getProfile:
    handler: functions/tekkzy/get-profile.main
    events:
      - http:
          path: /{institution}/get-profile
          method: GET
          cors:
            origin: "*"
          authorizer: aws_iam
      - http:
          path: /get-profile
          method: GET
          cors:
            origin: "*"
          authorizer: aws_iam

  createProfile:
