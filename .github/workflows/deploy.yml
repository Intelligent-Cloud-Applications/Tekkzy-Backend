
name: Deploy Tekkzy Backend

on:
  push:
    branches:
      - tekkzy_kalahandi_heritage_backend
      - main
      - dev
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy to AWS Lambda & API Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # ── AWS CREDENTIALS SECTION (Add secrets to GitHub Settings > Secrets) ──
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      # ── POPULATE .ENV FROM GITHUB SECRETS / DEFAULTS ────────────────────────
      - name: Generate .env Configuration
        run: |
          cat << 'EOF' > .env
          # Cognito
          COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_IDENTITY_POOL_ID=${{ secrets.COGNITO_IDENTITY_POOL_ID }}
          COGNITO_REGION=${{ secrets.COGNITO_REGION || 'us-east-2' }}

          # Regions & Tables
          DATA_AWS_REGION=${{ secrets.DATA_AWS_REGION || 'us-east-2' }}
          PROFILE_TABLE_NAME=${{ secrets.PROFILE_TABLE_NAME || 'beta_user_profile' }}
          PAYMENT_TABLE_NAME=${{ secrets.PAYMENT_TABLE_NAME || 'beta_payment' }}
          SITE_TABLE=${{ secrets.SITE_TABLE || 'beta_site_table' }}
          BETA_TEMPLATE_TABLE=${{ secrets.BETA_TEMPLATE_TABLE || 'beta_tekkzy_template' }}

          # S3 & Hosting
          SITE_DEPLOY_BUCKET=${{ secrets.SITE_DEPLOY_BUCKET || 'thekalahandiheritage.com' }}
          TEMPLATE_ASSETS_BUCKET=${{ secrets.TEMPLATE_ASSETS_BUCKET || 'institution-utils' }}
          TEMPLATE_ASSETS_BUCKET_REGION=${{ secrets.TEMPLATE_ASSETS_BUCKET_REGION || 'us-east-1' }}
          SERVERLESS_DEPLOYMENT_BUCKET=${{ secrets.SERVERLESS_DEPLOYMENT_BUCKET || 'tekkzy-backend-dev' }}
          HOSTED_ZONE_ID=${{ secrets.HOSTED_ZONE_ID || '' }}

          # Pricing
          TEKKZY_DOMAIN_GRACE_DAYS=7
          DOMAIN_MARKUP_USD=5
          USD_TO_INR_RATE=86

          # Payment Gateways (Leave blank if not needed)
          RAZORPAY_TEST_KEY_ID=${{ secrets.RAZORPAY_TEST_KEY_ID || '' }}
          RAZORPAY_TEST_SECRET_KEY=${{ secrets.RAZORPAY_TEST_SECRET_KEY || '' }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET || '' }}
          RAZORPAY_PLAN_ID_MONTHLY=${{ secrets.RAZORPAY_PLAN_ID_MONTHLY || '' }}
          RAZORPAY_PLAN_ID_YEARLY=${{ secrets.RAZORPAY_PLAN_ID_YEARLY || '' }}
          PAYPAL_CLIENT_ID=${{ secrets.PAYPAL_CLIENT_ID || '' }}
          PAYPAL_SECRET=${{ secrets.PAYPAL_SECRET || '' }}
          AWSAIAPP_PAYPAL_CLIENT_ID=${{ secrets.AWSAIAPP_PAYPAL_CLIENT_ID || '' }}
          AWSAIAPP_PAYPAL_SECRET=${{ secrets.AWSAIAPP_PAYPAL_SECRET || '' }}
          EOF

      # ── SERVERLESS DEPLOYMENT ────────────────────────────────────────────────
      - name: Deploy via Serverless Framework
        run: npx serverless deploy --stage dev --region us-east-2
